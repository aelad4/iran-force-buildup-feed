<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iran Force Buildup Feed</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6676;--line:#dfe3ea;--accent:#1f5fbf;
--s1:#8a93a3;--s2:#4a7fc1;--s3:#c58a12;--s4:#d4620f;--s5:#c0262d;--warn:#9a5b00;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171c25;--ink:#e8ebf1;--mute:#98a1b2;--line:#2a3140;--accent:#6aa3ff;
--s1:#7c8597;--s2:#6aa3ff;--s3:#e0a530;--s4:#f08a3c;--s5:#ff6b73;--warn:#e0a530;--ok:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters input,.filters select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
.filters input{flex:1 1 220px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s1);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.item h2{font-size:16px;margin:0 0 4px}
.item h2 a{color:var(--ink);text-decoration:none}.item h2 a:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.why{margin-top:6px;font-size:14px}.why b{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mute)}
.sig{font-weight:700}
.v-unverified_state_claim{color:var(--warn)}.v-corroborated,.v-imagery_supported{color:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Iran Force Buildup Feed</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search title, summary, source…" aria-label="Search">
    <select id="cat" aria-label="Category"></select>
    <select id="branch" aria-label="Branch"></select>
    <select id="stype" aria-label="Source type"></select>
    <select id="ver" aria-label="Verification"></select>
    <select id="sig" aria-label="Minimum significance">
      <option value="0">Any significance</option><option value="3">3+</option><option value="4">4+</option><option value="5">5 only</option>
    </select>
    <select id="range" aria-label="Date range">
      <option value="0">All time</option><option value="1">Last 24h</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option>
    </select>
  </div>
  <div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const label = s => String(s||'').replace(/_/g,' ');
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';
let items = [];

function fillSelect(el, title, values){
  el.replaceChildren(new Option(title, ''));
  [...new Set(values)].filter(Boolean).sort().forEach(v => el.append(new Option(label(v), v)));
}
function itemDate(i){ return new Date(i.published_date || i.found_at || 0); }

function render(){
  const q = $('q').value.trim().toLowerCase(), cat=$('cat').value, br=$('branch').value,
        st=$('stype').value, ve=$('ver').value, sg=+$('sig').value, days=+$('range').value;
  const cutoff = days ? Date.now() - days*864e5 : 0;
  const shown = items.filter(i =>
    (!q || [i.title,i.summary,i.why_it_matters,i.source_name].join(' ').toLowerCase().includes(q)) &&
    (!cat || (i.categories||[]).includes(cat)) && (!br || (i.branches||[]).includes(br)) &&
    (!st || i.source_type===st) && (!ve || i.verification===ve) &&
    (i.significance||0) >= sg && itemDate(i) >= cutoff);
  const list = $('list'); list.replaceChildren();
  if(!shown.length){ const d=document.createElement('div'); d.className='empty';
    d.textContent = items.length ? 'No items match these filters.' : 'No items yet. Run the sync after the first agent run.'; list.append(d); }
  const color = ['','--s1','--s2','--s3','--s4','--s5'];
  for(const i of shown){
    const art=document.createElement('article'); art.className='item';
    art.style.borderLeftColor=`var(${color[Math.min(5,Math.max(1,i.significance||1))]})`;
    const h=document.createElement('h2'), a=document.createElement('a');
    a.href=safeUrl(i.url); a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=i.title||'(untitled)'; h.append(a);
    const meta=document.createElement('div'); meta.className='meta';
    const sig=document.createElement('span'); sig.className='sig'; sig.textContent=`Significance ${i.significance||'?'}`;
    const ver=document.createElement('span'); ver.className='v-'+i.verification; ver.textContent=label(i.verification);
    meta.append(sig, ` · ${i.source_name||''} (${label(i.source_type)}) · ${i.published_date||'date unknown'} · ${(i.language||'').toUpperCase()} · `, ver);
    const sum=document.createElement('div'); sum.textContent=i.summary||'';
    const why=document.createElement('div'); why.className='why'; const b=document.createElement('b'); b.textContent='Why it matters: ';
    why.append(b, i.why_it_matters||'');
    const tags=document.createElement('div'); tags.className='tags';
    [...(i.categories||[]),...(i.branches||[])].forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=label(t);tags.append(s)});
    art.append(h,meta,sum,why,tags); list.append(art);
  }
}

function stats(){
  const now=Date.now(), n=d=>items.filter(i=>itemDate(i)>=now-d*864e5).length;
  const high=items.filter(i=>(i.significance||0)>=4 && itemDate(i)>=now-7*864e5).length;
  const claims=items.filter(i=>i.verification==='unverified_state_claim').length;
  const data=[[items.length,'Total items'],[n(1),'Last 24h'],[n(7),'Last 7 days'],[high,'Significance 4+ (7d)'],[claims,'Unverified state claims']];
  $('stats').replaceChildren(...data.map(([v,l])=>{const d=document.createElement('div');d.className='stat';
    const b=document.createElement('b');b.textContent=v;const s=document.createElement('span');s.textContent=l;d.append(b,s);return d}));
}

fetch('./feed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  items=(d.items||[]).slice().sort((a,b)=>itemDate(b)-itemDate(a));
  $('updated').textContent = d.updated_at ? 'Feed updated ' + new Date(d.updated_at).toLocaleString() : 'No data synced yet';
  fillSelect($('cat'),'All categories',items.flatMap(i=>i.categories||[]));
  fillSelect($('branch'),'All branches',items.flatMap(i=>i.branches||[]));
  fillSelect($('stype'),'All source types',items.map(i=>i.source_type));
  fillSelect($('ver'),'All verification levels',items.map(i=>i.verification));
  stats(); render();
}).catch(e=>{$('updated').textContent='Could not load feed.json ('+e.message+'). Open the published page, not the file.'});
['q','cat','branch','stype','ver','sig','range'].forEach(id=>$(id).addEventListener('input',render));
</script>
</body>
</html>
