<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פיד התעצמות צבאית של איראן</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6676;--line:#dfe3ea;--accent:#1f5fbf;
--s1:#8a93a3;--s2:#4a7fc1;--s3:#c58a12;--s4:#d4620f;--s5:#c0262d;--warn:#9a5b00;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171c25;--ink:#e8ebf1;--mute:#98a1b2;--line:#2a3140;--accent:#6aa3ff;
--s1:#7c8597;--s2:#6aa3ff;--s3:#e0a530;--s4:#f08a3c;--s5:#ff6b73;--warn:#e0a530;--ok:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters input,.filters select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
.filters input{flex:1 1 220px}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--s1);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.item h2{font-size:16px;margin:0 0 4px}
.item h2 a{color:var(--ink);text-decoration:none}.item h2 a:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.why{margin-top:6px;font-size:14px}.why b{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mute)}
.sig{font-weight:700}
.v-unverified_state_claim{color:var(--warn)}.v-corroborated,.v-imagery_supported{color:var(--ok)}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.axis{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;text-align:start;cursor:pointer}
.axis b{font-size:18px;margin-inline-end:6px}.axis[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.axis[disabled]{opacity:.55;cursor:default}
.tag.dom{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>פיד התעצמות צבאית של איראן</h1>
  <div class="sub" id="updated">טוען…</div>
  <div class="stats" id="stats"></div>
  <div class="axes" id="axes" role="group" aria-label="צירי התעצמות"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="חיפוש בכותרת, בתקציר, במקור…" aria-label="חיפוש">
    <select id="dom" aria-label="ציר התעצמות"></select>
    <select id="cat" aria-label="קטגוריה"></select>
    <select id="branch" aria-label="זרוע"></select>
    <select id="stype" aria-label="סוג מקור"></select>
    <select id="ver" aria-label="אימות"></select>
    <select id="sig" aria-label="משמעותיות מינימלית">
      <option value="0">כל רמות המשמעותיות</option><option value="3">3 ומעלה</option><option value="4">4 ומעלה</option><option value="5">5 בלבד</option>
    </select>
    <select id="range" aria-label="טווח תאריכים">
      <option value="0">כל הזמנים</option><option value="1">24 שעות אחרונות</option><option value="7">7 ימים אחרונים</option><option value="30">30 ימים אחרונים</option>
    </select>
  </div>
  <div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const DOMAINS = ['personnel','training','weapons','infrastructure','organization','statements'];
const HE = {
  personnel:'כוח אדם', training:'אימונים והכשרות', weapons:'אמל״ח ואמצעים', infrastructure:'תשתיות', organization:'מבנה וארגון', statements:'נאומים והצהרות',
  missiles:'טילים', drones:'כטב״מים ומל״טים', air_defense:'הגנה אווירית', naval:'ים', air_force:'חיל האוויר', space:'חלל',
  c4isr_ew:'פיקוד, בקרה ולוחמה אלקטרונית', transfer_to_iran:'העברות לאיראן', transfer_from_iran:'העברות מאיראן', production_capacity:'יכולת ייצור',
  budget:'תקציב', exercises:'תרגילים', sanctions_networks:'סנקציות ורשתות רכש', other:'אחר',
  artesh:'צבא (ארטש)', irgc_ground:'כוחות היבשה של המשמרות', irgc_aerospace:'חיל החלל של המשמרות', irgc_navy:'חיל הים של המשמרות',
  mod_industries:'משרד הביטחון ותעשיותיו', unspecified:'לא מוגדר',
  state_media:'תקשורת ממלכתית', irgc_media:'תקשורת המשמרות', telegram:'טלגרם', independent_analyst:'אנליסט עצמאי',
  think_tank:'מכון מחקר', government:'גוף ממשלתי', news_outlet:'כלי חדשות', database:'מאגר נתונים',
  unverified_state_claim:'טענה ממלכתית לא מאומתת', single_source:'מקור יחיד', corroborated:'מאושר ממקור נוסף', imagery_supported:'נתמך בתצלומים',
  fa:'פרסית', en:'אנגלית', ar:'ערבית'
};
const label = s => HE[s] || String(s||'').replace(/_/g,' ');
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';
let items = [];

function fillSelect(el, title, values){
  el.replaceChildren(new Option(title, ''));
  [...new Set(values)].filter(Boolean).sort().forEach(v => el.append(new Option(label(v), v)));
}
function itemDate(i){ return new Date(i.published_date || i.found_at || 0); }

function render(){
  const q = $('q').value.trim().toLowerCase(), dom=$('dom').value, cat=$('cat').value, br=$('branch').value,
        st=$('stype').value, ve=$('ver').value, sg=+$('sig').value, days=+$('range').value;
  const cutoff = days ? Date.now() - days*864e5 : 0;
  const shown = items.filter(i =>
    (!q || [i.title,i.summary,i.why_it_matters,i.source_name].join(' ').toLowerCase().includes(q)) &&
    (!dom || (i.domains||[]).includes(dom)) && (!cat || (i.categories||[]).includes(cat)) && (!br || (i.branches||[]).includes(br)) &&
    (!st || i.source_type===st) && (!ve || i.verification===ve) &&
    (i.significance||0) >= sg && itemDate(i) >= cutoff);
  const list = $('list'); list.replaceChildren();
  if(!shown.length){ const d=document.createElement('div'); d.className='empty';
    d.textContent = items.length ? 'אין פריטים שמתאימים למסננים.' : 'עדיין אין פריטים. הם יופיעו אחרי הריצה הראשונה.'; list.append(d); }
  const color = ['','--s1','--s2','--s3','--s4','--s5'];
  for(const i of shown){
    const art=document.createElement('article'); art.className='item';
    art.style.borderInlineStartColor=`var(${color[Math.min(5,Math.max(1,i.significance||1))]})`;
    const h=document.createElement('h2'), a=document.createElement('a'); h.dir='auto';
    a.href=safeUrl(i.url); a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=i.title||'(ללא כותרת)'; h.append(a);
    const meta=document.createElement('div'); meta.className='meta';
    const sig=document.createElement('span'); sig.className='sig'; sig.textContent=`משמעותיות ${i.significance||'?'}`;
    const ver=document.createElement('span'); ver.className='v-'+i.verification; ver.textContent=label(i.verification);
    meta.append(sig, ` · ${i.source_name||''} (${label(i.source_type)}) · ${i.published_date||'תאריך לא ידוע'} · ${label(i.language)} · `, ver);
    const sum=document.createElement('div'); sum.textContent=i.summary||''; sum.dir='auto';
    const why=document.createElement('div'); why.className='why'; why.dir='auto'; const b=document.createElement('b'); b.textContent='למה זה חשוב: ';
    why.append(b, i.why_it_matters||'');
    const tags=document.createElement('div'); tags.className='tags';
    (i.domains||[]).forEach(t=>{const s=document.createElement('span');s.className='tag dom';s.textContent=label(t);tags.append(s)});
    [...(i.categories||[]),...(i.branches||[])].forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=label(t);tags.append(s)});
    art.append(h,meta,sum,why,tags); list.append(art);
  }
}

function axes(){
  const cur=$('dom').value;
  $('axes').replaceChildren(...DOMAINS.map(k=>{const n=items.filter(i=>(i.domains||[]).includes(k)).length;
    const btn=document.createElement('button');btn.type='button';btn.className='axis';btn.disabled=!n;btn.setAttribute('aria-pressed',String(cur===k));
    const b=document.createElement('b');b.textContent=n;btn.append(b,label(k));
    btn.onclick=()=>{$('dom').value=(cur===k?'':k);axes();render()};return btn}));
}
function stats(){
  const now=Date.now(), n=d=>items.filter(i=>itemDate(i)>=now-d*864e5).length;
  const high=items.filter(i=>(i.significance||0)>=4 && itemDate(i)>=now-7*864e5).length;
  const claims=items.filter(i=>i.verification==='unverified_state_claim').length;
  const data=[[items.length,'סה״כ פריטים'],[n(1),'24 שעות אחרונות'],[n(7),'7 ימים אחרונים'],[high,'משמעותיות 4+ (7 ימים)'],[claims,'טענות ממלכתיות לא מאומתות']];
  $('stats').replaceChildren(...data.map(([v,l])=>{const d=document.createElement('div');d.className='stat';
    const b=document.createElement('b');b.textContent=v;const s=document.createElement('span');s.textContent=l;d.append(b,s);return d}));
}

fetch('./feed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  items=(d.items||[]).slice().sort((a,b)=>itemDate(b)-itemDate(a));
  $('updated').textContent = d.updated_at ? 'הפיד עודכן ' + new Date(d.updated_at).toLocaleString('he-IL') : 'עדיין לא נאסף מידע';
  $('dom').replaceChildren(new Option('כל צירי ההתעצמות',''), ...DOMAINS.map(k=>new Option(label(k),k)));
  fillSelect($('cat'),'כל הקטגוריות',items.flatMap(i=>i.categories||[]));
  fillSelect($('branch'),'כל הזרועות',items.flatMap(i=>i.branches||[]));
  fillSelect($('stype'),'כל סוגי המקורות',items.map(i=>i.source_type));
  fillSelect($('ver'),'כל רמות האימות',items.map(i=>i.verification));
  stats(); axes(); render();
}).catch(e=>{$('updated').textContent='לא ניתן לטעון את feed.json ('+e.message+'). פתח את האתר המפורסם ולא את הקובץ.'});
$('dom').addEventListener('input',axes);
['q','dom','cat','branch','stype','ver','sig','range'].forEach(id=>$(id).addEventListener('input',render));
</script>
</body>
</html>
